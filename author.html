<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="লেখকের পরিচিতি ও তাঁর রচনাসমূহ - মুক্তগ্রন্থ">
    <title>লেখক - মুক্তগ্রন্থ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <script src="assets/js/shared.js"></script>
    
    <style>
        .author-avatar {
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--primary-brown), var(--primary-green));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-weight: 700;
        }
        
        .stats-card {
            background: linear-gradient(135deg, var(--bg-light), white);
        }
    </style>
</head>
<body>
    <!-- Header will be inserted by shared.js -->
    <header id="site-header"></header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Breadcrumb -->
        <nav class="text-sm mb-6 text-gray-600" aria-label="Breadcrumb">
            <ol class="flex items-center space-x-2">
                <li><a href="index.html" class="text-[#5E8B7E] hover:underline">হোম</a></li>
                <li class="text-gray-400">›</li>
                <li id="author-breadcrumb" class="text-gray-500">লেখক</li>
            </ol>
        </nav>

        <div class="max-w-6xl mx-auto">
            <!-- Author Header -->
            <div class="grid md:grid-cols-4 gap-8 mb-12">
                <div class="md:col-span-1">
                    <div id="author-avatar" class="author-avatar rounded-full w-48 h-48 mx-auto mb-4">
                        <span id="author-initial">?</span>
                    </div>
                </div>
                
                <div class="md:col-span-3">
                    <h1 id="author-name" class="text-3xl md:text-4xl font-bold text-[#8C6B5D] mb-4">লেখকের নাম</h1>
                    
                    <div id="author-bio" class="text-lg text-gray-700 mb-6">
                        <p>লেখক সম্পর্কে বিস্তারিত তথ্য এখানে থাকবে।</p>
                    </div>
                    
                    <!-- Author Stats -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div class="stats-card text-center p-4 rounded-lg">
                            <div id="total-books" class="text-2xl font-bold text-[#8C6B5D]">0</div>
                            <div class="text-sm text-gray-600">মোট বই</div>
                        </div>
                        <div class="stats-card text-center p-4 rounded-lg">
                            <div id="death-year" class="text-2xl font-bold text-[#8C6B5D]">—</div>
                            <div class="text-sm text-gray-600">মৃত্যু সাল</div>
                        </div>
                        <div class="stats-card text-center p-4 rounded-lg">
                            <div id="most-genre" class="text-2xl font-bold text-[#8C6B5D]">—</div>
                            <div class="text-sm text-gray-600">প্রধান ধরন</div>
                        </div>
                        <div class="stats-card text-center p-4 rounded-lg">
                            <div class="text-2xl font-bold text-[#8C6B5D]">📚</div>
                            <div class="text-sm text-gray-600">পাবলিক ডোমেইন</div>
                        </div>
                    </div>
                    
                    <!-- External Links -->
                    <div class="flex flex-wrap gap-3">
                        <a id="goodreads-link" href="#" target="_blank" rel="noopener noreferrer" 
                           class="btn-primary text-white px-4 py-2 rounded-md font-semibold inline-flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                            Goodreads-এ খুঁজুন
                        </a>
                        <a id="wikipedia-link" href="#" target="_blank" rel="noopener noreferrer"
                           class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md font-semibold inline-flex items-center transition-all">
                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                            উইকিপিডিয়া
                        </a>
                    </div>
                </div>
            </div>

            <!-- Author's Books -->
            <section>
                <h2 class="text-2xl font-semibold mb-6 text-[#5E8B7E]">এই লেখকের বইসমূহ</h2>
                
                <!-- Filter and Search Controls -->
                <div class="mb-6 flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <input type="text" id="author-book-search" placeholder="বই খুঁজুন..." 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#5E8B7E] focus:border-transparent">
                    </div>
                    <div id="genre-filter-container" class="sm:w-48">
                        <!-- Genre filter will be populated by JavaScript -->
                    </div>
                </div>
                
                <div id="author-books" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="text-center py-12 col-span-full">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#8C6B5D] mx-auto mb-4"></div>
                        <p class="text-gray-600">বইয়ের তালিকা লোড হচ্ছে...</p>
                    </div>
                </div>
            </section>

            <!-- Biography Section -->
            <section class="mt-12">
                <h2 class="text-2xl font-semibold mb-6 text-[#5E8B7E]">জীবনী</h2>
                <div class="bg-white rounded-lg shadow p-6">
                    <div id="author-biography" class="prose max-w-none">
                        <p class="text-gray-600">লেখকের বিস্তারিত জীবনী শীঘ্রই যোগ করা হবে।</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer will be inserted by shared.js -->
    <footer id="site-footer"></footer>

    <script>
        // Initialize shared components and page-specific functionality
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize author page
            new AuthorPage();
        });

        class AuthorPage {
            constructor() {
                this.authorName = this.getAuthorNameFromURL();
                this.authorBooks = [];
                this.allBooks = [];
                this.init();
            }

            getAuthorNameFromURL() {
                const params = new URLSearchParams(window.location.search);
                return params.get('author') || '';
            }

            async init() {
                this.updatePageTitle();
                await this.loadAuthorData();
                this.setupExternalLinks();
            }

            updatePageTitle() {
                if (this.authorName) {
                    document.title = `${this.authorName} - মুক্তগ্রন্থ`;
                    document.getElementById('author-name').textContent = this.authorName;
                    document.getElementById('author-breadcrumb').textContent = this.authorName;
                    
                    // Set author initial for avatar
                    const initial = this.authorName.charAt(0).toUpperCase();
                    document.getElementById('author-initial').textContent = initial;
                }
            }

            async loadAuthorData() {
                try {
                    MuktoGrontho.utils.showLoading('main');
                    
                    this.allBooks = await MuktoGrontho.api.fetchBooks();
                    this.authorBooks = this.allBooks.filter(book => book.author === this.authorName);
                    
                    if (this.authorBooks.length === 0) {
                        this.showNoBooks();
                        return;
                    }
                    
                    this.renderAuthorStats();
                    this.renderAuthorBooks();
                    this.setupGenreFilter();
                    this.setupSearch();
                } catch (error) {
                    console.error('Error loading author data:', error);
                    this.showError('লেখকের তথ্য লোড করতে সমস্যা হয়েছে');
                } finally {
                    MuktoGrontho.utils.hideLoading('main');
                }
            }

            renderAuthorStats() {
                if (this.authorBooks.length === 0) return;

                // Total books
                document.getElementById('total-books').textContent = this.authorBooks.length;

                // Death year (assuming all books have same death year)
                const deathYear = this.authorBooks[0].deathYear;
                document.getElementById('death-year').textContent = deathYear || '—';

                // Most common genre
                const genreCounts = this.authorBooks.reduce((acc, book) => {
                    acc[book.genre] = (acc[book.genre] || 0) + 1;
                    return acc;
                }, {});
                
                const mostCommonGenre = Object.entries(genreCounts)
                    .sort(([,a], [,b]) => b - a)[0]?.[0] || '—';
                
                document.getElementById('most-genre').textContent = mostCommonGenre;
            }

            renderAuthorBooks() {
                const container = document.getElementById('author-books');
                
                if (this.authorBooks.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                            </svg>
                            <p class="text-gray-600">এই লেখকের কোনো বই আমাদের তালিকায় নেই।</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.authorBooks.map(book => `
                    <div class="book-card bg-white rounded-lg shadow overflow-hidden">
                        <div class="aspect-w-2 aspect-h-3 bg-gradient-to-br from-[#8C6B5D] to-[#5E8B7E] flex items-center justify-center text-white p-4">
                            <div class="text-center">
                                <div class="text-sm font-bold">${this.escapeHtml(book.title)}</div>
                            </div>
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-lg mb-2 line-clamp-2">
                                <a href="book.html?title=${encodeURIComponent(book.title)}" 
                                   class="text-[#5E8B7E] hover:underline">
                                    ${this.escapeHtml(book.title)}
                                </a>
                            </h3>
                            <p class="text-gray-600 text-sm mb-2">${this.escapeHtml(book.genre)}</p>
                            <div class="flex justify-between items-center text-xs text-gray-500">
                                <span>পাবলিক ডোমেইন</span>
                                <span>${book.deathYear}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            setupExternalLinks() {
                if (!this.authorName) return;

                // Goodreads search link
                const goodreadsLink = document.getElementById('goodreads-link');
                const goodreadsQuery = encodeURIComponent(`${this.authorName} site:goodreads.com`);
                goodreadsLink.href = `https://www.google.com/search?q=${goodreadsQuery}`;

                // Wikipedia search link
                const wikipediaLink = document.getElementById('wikipedia-link');
                const wikipediaQuery = encodeURIComponent(`${this.authorName} site:bn.wikipedia.org OR site:en.wikipedia.org`);
                wikipediaLink.href = `https://www.google.com/search?q=${wikipediaQuery}`;
            }

            setupGenreFilter() {
                const genres = [...new Set(this.authorBooks.map(book => book.genre))].sort();
                const filterContainer = document.getElementById('genre-filter-container');
                
                if (genres.length <= 1) {
                    filterContainer.style.display = 'none';
                    return;
                }

                const filterSelect = document.createElement('select');
                filterSelect.id = 'author-genre-filter';
                filterSelect.className = 'px-3 py-2 border border-gray-300 rounded-lg text-sm';
                filterSelect.innerHTML = `
                    <option value="">সকল ধরন</option>
                    ${genres.map(genre => `<option value="${this.escapeHtml(genre)}">${genre}</option>`).join('')}
                `;

                filterSelect.addEventListener('change', () => this.filterBooks());
                filterContainer.appendChild(filterSelect);
            }

            setupSearch() {
                const searchInput = document.getElementById('author-book-search');
                if (searchInput) {
                    searchInput.addEventListener('input', MuktoGrontho.utils.debounce(() => {
                        this.filterBooks();
                    }, 300));
                }
            }

            filterBooks() {
                const genreFilter = document.getElementById('author-genre-filter');
                const searchInput = document.getElementById('author-book-search');
                
                const selectedGenre = genreFilter?.value || '';
                const searchTerm = searchInput?.value.toLowerCase() || '';

                let filteredBooks = this.authorBooks;

                if (selectedGenre) {
                    filteredBooks = filteredBooks.filter(book => book.genre === selectedGenre);
                }

                if (searchTerm) {
                    filteredBooks = filteredBooks.filter(book => 
                        book.title.toLowerCase().includes(searchTerm) ||
                        book.genre.toLowerCase().includes(searchTerm) ||
                        (book.description && book.description.toLowerCase().includes(searchTerm))
                    );
                }

                this.renderFilteredBooks(filteredBooks);
            }

            renderFilteredBooks(books) {
                const container = document.getElementById('author-books');
                
                if (books.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <div class="text-gray-400 mb-4">
                                <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                </svg>
                            </div>
                            <p class="text-gray-600">কোনো বই পাওয়া যায়নি</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = books.map(book => `
                    <div class="book-card bg-white rounded-lg shadow-lg overflow-hidden">
                        <div class="aspect-[3/4] bg-gradient-to-br from-[#EAE0D5] to-[#DCD0C0] flex items-center justify-center text-[#8C6B5D] font-medium">
                            📖
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-lg mb-2 line-clamp-2">
                                <a href="book.html?title=${encodeURIComponent(book.title)}" class="text-[#8C6B5D] hover:text-[#5E8B7E]">
                                    ${this.escapeHtml(book.title)}
                                </a>
                            </h3>
                            <div class="flex justify-between items-center text-sm text-gray-600">
                                <span>${book.genre}</span>
                                <span>পাবলিক ডোমেইন</span>
                                <span>${book.deathYear}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            showNoBooks() {
                const container = document.getElementById('author-books');
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="text-gray-400 mb-4">
                            <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-700 mb-2">এই লেখকের কোনো বই পাওয়া যায়নি</h3>
                        <p class="text-gray-600 mb-4">আমাদের সংগ্রহে এই লেখকের কোনো বই এখনো যোগ করা হয়নি।</p>
                        <a href="index.html#books" class="btn-primary">সকল বই দেখুন</a>
                    </div>
                `;
            }

            showError(message) {
                const container = document.getElementById('author-books');
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="text-red-500 mb-2">
                            <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <p class="text-red-600">${message}</p>
                    </div>
                `;
            }

            escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"']/g, m => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[m]));
            }
        }

    </script>
</body>
</html>
