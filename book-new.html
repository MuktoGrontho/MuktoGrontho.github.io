<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="বইয়ের বিস্তারিত তথ্য ও পাঠকদের মতামত - মুক্তগ্রন্থ">
    <title>বইয়ের নাম - মুক্তগ্রন্থ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <script src="assets/js/shared.js"></script>
    
    <style>
        .star-rating {
            color: #fbbf24;
        }
        
        .star-empty {
            color: #d1d5db;
        }
    </style>
</head>
<body>
    <!-- Header will be inserted by shared.js -->
    <header id="site-header"></header>
    
    <!-- Breadcrumb will be inserted by shared.js -->
    <nav id="breadcrumb-nav"></nav>

    <main class="container mx-auto px-4 py-8">
        <!-- Book Details Card -->
        <div class="card mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="book-details">
                <!-- Content will be loaded dynamically -->
            </div>
        </div>

        <!-- Reviews Section -->
        <div class="card">
            <h2 class="section-title mb-6">পাঠকদের মতামত</h2>
            
            <!-- Add Review Form -->
            <div class="mb-8 p-6 bg-gray-50 rounded-lg">
                <h3 class="text-lg font-semibold mb-4">আপনার মতামত দিন</h3>
                <form id="review-form" class="space-y-4">
                    <div>
                        <label for="reviewer-name" class="block text-sm font-medium mb-2">আপনার নাম</label>
                        <input type="text" id="reviewer-name" name="name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500" required>
                    </div>
                    
                    <div>
                        <label for="rating" class="block text-sm font-medium mb-2">রেটিং</label>
                        <div class="flex space-x-1" id="rating-stars">
                            <!-- Stars will be generated by JavaScript -->
                        </div>
                        <input type="hidden" id="rating-value" name="rating" value="5">
                    </div>
                    
                    <div>
                        <label for="review-text" class="block text-sm font-medium mb-2">মন্তব্য</label>
                        <textarea id="review-text" name="review" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500" placeholder="এই বই সম্পর্কে আপনার অভিজ্ঞতা শেয়ার করুন..." required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        মতামত পোস্ট করুন
                    </button>
                </form>
            </div>

            <!-- Reviews List -->
            <div id="reviews-list">
                <!-- Reviews will be loaded dynamically -->
            </div>
        </div>
    </main>

    <!-- Footer will be inserted by shared.js -->
    <footer id="site-footer"></footer>

    <script>
        class BookPage {
            constructor() {
                this.bookId = null;
                this.bookData = null;
                this.reviews = [];
                this.userRating = 5;
                
                this.init();
            }
            
            init() {
                // Initialize shared components first
                document.addEventListener('DOMContentLoaded', () => {
                    MuktoGrontho.init();
                    this.loadBookData();
                    this.setupEventListeners();
                    this.loadReviews();
                });
            }
            
            loadBookData() {
                const urlParams = new URLSearchParams(window.location.search);
                const bookId = urlParams.get('id');
                
                if (!bookId) {
                    this.showError('বইয়ের তথ্য পাওয়া যায়নি');
                    return;
                }
                
                this.bookId = bookId;
                
                // Load book data
                MuktoGrontho.api.fetchBooks()
                    .then(books => {
                        this.bookData = books.find(book => book.id === bookId);
                        if (this.bookData) {
                            this.renderBookDetails();
                            this.updateBreadcrumb();
                            document.title = `${this.bookData.title} - মুক্তগ্রন্থ`;
                        } else {
                            this.showError('বই খুঁজে পাওয়া যায়নি');
                        }
                    })
                    .catch(error => {
                        console.error('Error loading book data:', error);
                        this.showError('বইয়ের তথ্য লোড করতে সমস্যা হয়েছে');
                    });
            }
            
            renderBookDetails() {
                const container = document.getElementById('book-details');
                if (!container || !this.bookData) return;
                
                const book = this.bookData;
                const averageRating = this.calculateAverageRating();
                
                container.innerHTML = `
                    <div class="md:col-span-1">
                        <div class="book-img-placeholder w-full h-80 rounded-lg mb-4">
                            ${MuktoGrontho.utils.getPlaceholderContent('book')}
                        </div>
                    </div>
                    
                    <div class="md:col-span-2">
                        <h1 class="text-3xl font-bold mb-4">${MuktoGrontho.utils.escapeHtml(book.title)}</h1>
                        
                        <div class="space-y-3 mb-6">
                            <p class="text-lg">
                                <span class="font-semibold">লেখক:</span> 
                                <a href="author.html?name=${encodeURIComponent(book.author)}" class="text-blue-600 hover:underline">
                                    ${MuktoGrontho.utils.escapeHtml(book.author)}
                                </a>
                            </p>
                            
                            <p class="text-lg">
                                <span class="font-semibold">ধরন:</span> 
                                ${MuktoGrontho.utils.escapeHtml(book.genre)}
                            </p>
                            
                            ${book.deathYear ? `
                                <p class="text-lg">
                                    <span class="font-semibold">লেখকের মৃত্যু:</span> 
                                    ${book.deathYear}
                                </p>
                            ` : ''}
                            
                            <div class="flex items-center space-x-2">
                                <span class="font-semibold">রেটিং:</span>
                                <div class="flex items-center space-x-1">
                                    ${this.renderStars(averageRating)}
                                    <span class="text-gray-600">(${this.reviews.length} মন্তব্য)</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="space-y-4">
                            <a href="#" class="btn-primary inline-flex items-center space-x-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                <span>ডাউনলোড</span>
                            </a>
                            
                            <button class="btn-secondary ml-4 inline-flex items-center space-x-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                </svg>
                                <span>পছন্দ করুন</span>
                            </button>
                        </div>
                    </div>
                `;
            }
            
            updateBreadcrumb() {
                if (this.bookData) {
                    const breadcrumbItems = [
                        { text: 'হোম', href: 'index.html' },
                        { text: this.bookData.title, href: null }
                    ];
                    MuktoGrontho.ui.generateBreadcrumb(breadcrumbItems, '#breadcrumb-nav');
                }
            }
            
            setupEventListeners() {
                // Rating stars
                this.setupRatingStars();
                
                // Review form
                const form = document.getElementById('review-form');
                if (form) {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        this.submitReview();
                    });
                }
            }
            
            setupRatingStars() {
                const starsContainer = document.getElementById('rating-stars');
                if (!starsContainer) return;
                
                starsContainer.innerHTML = '';
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement('button');
                    star.type = 'button';
                    star.className = 'text-2xl focus:outline-none';
                    star.innerHTML = '★';
                    star.addEventListener('click', () => this.setRating(i));
                    starsContainer.appendChild(star);
                }
                
                this.updateRatingDisplay();
            }
            
            setRating(rating) {
                this.userRating = rating;
                document.getElementById('rating-value').value = rating;
                this.updateRatingDisplay();
            }
            
            updateRatingDisplay() {
                const stars = document.querySelectorAll('#rating-stars button');
                stars.forEach((star, index) => {
                    if (index < this.userRating) {
                        star.className = 'text-2xl focus:outline-none star-rating';
                    } else {
                        star.className = 'text-2xl focus:outline-none star-empty';
                    }
                });
            }
            
            submitReview() {
                const formData = new FormData(document.getElementById('review-form'));
                const review = {
                    id: Date.now().toString(),
                    bookId: this.bookId,
                    name: formData.get('name'),
                    rating: parseInt(formData.get('rating')),
                    review: formData.get('review'),
                    date: new Date().toISOString()
                };
                
                // Save to localStorage
                this.reviews.push(review);
                this.saveReviews();
                
                // Reset form
                document.getElementById('review-form').reset();
                this.setRating(5);
                
                // Re-render reviews
                this.renderReviews();
                this.renderBookDetails(); // Update rating display
                
                // Show success message
                this.showSuccess('আপনার মতামত সফলভাবে যোগ করা হয়েছে!');
            }
            
            loadReviews() {
                try {
                    const savedReviews = localStorage.getItem('muktoGrontho_reviews');
                    if (savedReviews) {
                        const allReviews = JSON.parse(savedReviews);
                        this.reviews = allReviews.filter(review => review.bookId === this.bookId);
                    }
                } catch (error) {
                    console.error('Error loading reviews:', error);
                    this.reviews = [];
                }
                
                this.renderReviews();
            }
            
            saveReviews() {
                try {
                    const savedReviews = localStorage.getItem('muktoGrontho_reviews');
                    let allReviews = savedReviews ? JSON.parse(savedReviews) : [];
                    
                    // Remove old reviews for this book
                    allReviews = allReviews.filter(review => review.bookId !== this.bookId);
                    
                    // Add current reviews
                    allReviews.push(...this.reviews);
                    
                    localStorage.setItem('muktoGrontho_reviews', JSON.stringify(allReviews));
                } catch (error) {
                    console.error('Error saving reviews:', error);
                }
            }
            
            renderReviews() {
                const container = document.getElementById('reviews-list');
                if (!container) return;
                
                if (this.reviews.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <p>এই বইয়ের জন্য এখনো কোনো মতামত নেই।</p>
                            <p>প্রথম মতামত দিন!</p>
                        </div>
                    `;
                    return;
                }
                
                const reviewsHTML = this.reviews
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                    .map(review => `
                        <div class="review-card p-4 border border-gray-200 rounded-lg mb-4">
                            <div class="flex items-center justify-between mb-2">
                                <h4 class="font-semibold">${MuktoGrontho.utils.escapeHtml(review.name)}</h4>
                                <div class="flex items-center space-x-2">
                                    <div class="flex">${this.renderStars(review.rating)}</div>
                                    <span class="text-sm text-gray-500">${this.formatDate(review.date)}</span>
                                </div>
                            </div>
                            <p class="text-gray-700">${MuktoGrontho.utils.escapeHtml(review.review)}</p>
                        </div>
                    `).join('');
                
                container.innerHTML = reviewsHTML;
            }
            
            renderStars(rating) {
                let starsHTML = '';
                for (let i = 1; i <= 5; i++) {
                    if (i <= rating) {
                        starsHTML += '<span class="star-rating">★</span>';
                    } else {
                        starsHTML += '<span class="star-empty">★</span>';
                    }
                }
                return starsHTML;
            }
            
            calculateAverageRating() {
                if (this.reviews.length === 0) return 0;
                const sum = this.reviews.reduce((acc, review) => acc + review.rating, 0);
                return Math.round((sum / this.reviews.length) * 10) / 10;
            }
            
            formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('bn-BD');
            }
            
            showError(message) {
                const container = document.getElementById('book-details');
                if (container) {
                    container.innerHTML = `<div class="error p-4 rounded-lg">${message}</div>`;
                }
            }
            
            showSuccess(message) {
                // Create a temporary success message
                const successDiv = document.createElement('div');
                successDiv.className = 'success p-4 rounded-lg mb-4';
                successDiv.textContent = message;
                
                const reviewsSection = document.querySelector('.card:last-child');
                if (reviewsSection) {
                    reviewsSection.insertBefore(successDiv, reviewsSection.firstChild);
                    
                    // Remove after 3 seconds
                    setTimeout(() => {
                        successDiv.remove();
                    }, 3000);
                }
            }
        }
        
        // Initialize book page
        new BookPage();
    </script>
</body>
</html>
